services:
  haproxy:
    image: haproxy:2.9-alpine
    container_name: rinha-haproxy
    ports:
      - "9999:9999"
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      - web1
      - web2
    deploy:
      resources:
        limits:
          cpus: "0.15"
          memory: "40MB"
    networks:
      - payment-processor
      - default

  web1:
    build: .
    image: fabianoflorentino/eliot:v0.0.1
    environment:
      HTTP_ADDR: ":8080"
      REDIS_ADDR: "redis:6379"
      REDIS_POOL: "200"
      PROCESSOR_DEFAULT_URL: "http://payment-processor-default:8080"
      PROCESSOR_FALLBACK_URL: "http://payment-processor-fallback:8080"
      TIMEOUT_MS: "120"
      HEDGE_MS: "40"
    depends_on:
      - redis
    deploy:
      resources:
        limits:
          cpus: "0.6"
          memory: "120MB"
    networks:
      - payment-processor
      - default

  web2:
    image: fabianoflorentino/eliot:v0.0.1
    environment:
      HTTP_ADDR: ":8080"
      REDIS_ADDR: "redis:6379"
      REDIS_POOL: "200"
      PROCESSOR_DEFAULT_URL: "http://payment-processor-default:8080"
      PROCESSOR_FALLBACK_URL: "http://payment-processor-fallback:8080"
      TIMEOUT_MS: "120"
      HEDGE_MS: "40"
    depends_on:
      - redis
    deploy:
      resources:
        limits:
          cpus: "0.6"
          memory: "120MB"
    networks:
      - payment-processor
      - default

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    deploy:
      resources:
        limits:
          cpus: "0.15"
          memory: "70MB"
    networks:
      - default

networks:
  default:
  payment-processor:
    external: true
    name: payment-processor