global
    maxconn 4096
    tune.bufsize 32768
    tune.ssl.default-dh-param 2048
    log stdout format raw local0

defaults
    mode http
    option dontlognull
    timeout connect 2s
    timeout client 30s
    timeout server 30s

frontend fe
    bind *:9999
    default_backend be

backend be
    balance roundrobin
    option http-keep-alive
    http-reuse always
    server web1 web1:8080 check
    server web2 web2:8080 check
